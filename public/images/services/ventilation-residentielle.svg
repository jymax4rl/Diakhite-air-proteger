<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0d1529"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- House shape -->
  <polygon points="400,80 620,240 620,480 180,480 180,240" fill="none" stroke="#1a2d4f" stroke-width="3"/>
  <polygon points="400,80 640,250 360,250" fill="none" stroke="#111d36" stroke-width="2"/>
  <!-- Windows -->
  <rect x="260" y="300" width="80" height="80" rx="4" fill="#111d36" stroke="#1a2d4f" stroke-width="2"/>
  <rect x="460" y="300" width="80" height="80" rx="4" fill="#111d36" stroke="#1a2d4f" stroke-width="2"/>
  <!-- Vent circle -->
  <circle cx="400" cy="200" r="30" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="200" r="18" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
</svg>
