<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0d1529"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Large duct circles -->
  <circle cx="400" cy="250" r="160" fill="none" stroke="#1a2d4f" stroke-width="24"/>
  <circle cx="400" cy="250" r="112" fill="none" stroke="#111d36" stroke-width="18"/>
  <circle cx="400" cy="250" r="64" fill="none" stroke="#0d1529" stroke-width="14"/>
  <circle cx="400" cy="250" r="24" fill="#0d1529" stroke="#1a2d4f" stroke-width="4"/>
  <!-- Connecting pipes -->
  <rect x="240" y="230" width="160" height="40" rx="4" fill="#0d1529" stroke="#1a2d4f" stroke-width="2"/>
  <rect x="400" y="230" width="160" height="40" rx="4" fill="#0d1529" stroke="#1a2d4f" stroke-width="2"/>
  <rect x="380" y="410" width="40" height="140" rx="4" fill="#0d1529" stroke="#1a2d4f" stroke-width="2"/>
  <!-- Accent glow -->
  <circle cx="400" cy="250" r="168" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
</svg>
