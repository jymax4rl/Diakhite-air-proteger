<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0d1529"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Building grid -->
  <rect x="180" y="100" width="440" height="400" rx="4" fill="none" stroke="#1a2d4f" stroke-width="3"/>
  <!-- Floors -->
  <line x1="180" y1="200" x2="620" y2="200" stroke="#111d36" stroke-width="2"/>
  <line x1="180" y1="300" x2="620" y2="300" stroke="#111d36" stroke-width="2"/>
  <line x1="180" y1="400" x2="620" y2="400" stroke="#111d36" stroke-width="2"/>
  <!-- Windows -->
  <rect x="220" y="120" width="60" height="60" rx="2" fill="#111d36" stroke="#1a2d4f" stroke-width="1"/>
  <rect x="320" y="120" width="60" height="60" rx="2" fill="#111d36" stroke="#1a2d4f" stroke-width="1"/>
  <rect x="420" y="120" width="60" height="60" rx="2" fill="#111d36" stroke="#1a2d4f" stroke-width="1"/>
  <rect x="520" y="120" width="60" height="60" rx="2" fill="#111d36" stroke="#1a2d4f" stroke-width="1"/>
  <!-- Duct on top -->
  <rect x="280" y="50" width="240" height="40" rx="4" fill="#1a2d4f" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
</svg>
