<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#1a2d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2d4f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Duct circles -->
  <circle cx="1350" cy="280" r="220" fill="none" stroke="#1a2d4f" stroke-width="30"/>
  <circle cx="1350" cy="280" r="155" fill="none" stroke="#111d36" stroke-width="22"/>
  <circle cx="1350" cy="280" r="90" fill="none" stroke="#0d1529" stroke-width="18"/>
  <circle cx="1350" cy="280" r="36" fill="#0d1529"/>
  <!-- Horizontal ducts -->
  <rect x="900" y="255" width="460" height="50" rx="4" fill="#0d1529"/>
  <rect x="900" y="267" width="460" height="26" rx="2" fill="#111d36"/>
  <!-- Vertical duct -->
  <rect x="1325" y="500" width="50" height="280" rx="4" fill="#0d1529"/>
  <rect x="1337" y="500" width="26" height="280" rx="2" fill="#111d36"/>
  <!-- Secondary duct ring -->
  <circle cx="600" cy="700" r="140" fill="none" stroke="#0d1529" stroke-width="18"/>
  <circle cx="600" cy="700" r="90" fill="none" stroke="#0a1020" stroke-width="14"/>
  <!-- Grid lines -->
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#0d1529" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#0d1529" stroke-width="1" opacity="0.4"/>
  <line x1="480" y1="0" x2="480" y2="1080" stroke="#0d1529" stroke-width="1" opacity="0.4"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#0d1529" stroke-width="1" opacity="0.4"/>
  <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#0d1529" stroke-width="1" opacity="0.4"/>
</svg>
